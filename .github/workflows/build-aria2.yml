name: Build and Release Aria2

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.get_tag.outputs.RELEASE_TAG }}
    steps:
      - name: Get latest release tag
        id: get_tag
        run: |
          echo "RELEASE_TAG=$(curl -s https://api.github.com/repos/aria2/aria2/releases/latest | jq -r .tag_name)" >> $GITHUB_OUTPUT

  build-and-push-image:
    needs: [resolve-tag]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.resolve-tag.outputs.release_tag }}-${{ matrix.arch }}

  create-manifest:
    needs: [build-and-push-image, resolve-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ needs.resolve-tag.outputs.release_tag }} \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ needs.resolve-tag.outputs.release_tag }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ needs.resolve-tag.outputs.release_tag }}-arm64

  extract-binaries:
    needs: [create-manifest, resolve-tag]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from image
        run: |
          docker create --platform linux/${{ matrix.arch }} \
            --name extract \
            ghcr.io/${{ github.repository }}:${{ needs.resolve-tag.outputs.release_tag }}
          docker cp extract:/aria2c ./aria2c
          docker rm extract

      - name: Compress artifact
        run: |
          mkdir -p ./artifacts
          mv ./aria2c ./artifacts/aria2c
          cd ./artifacts
          tar -czvf aria2-linux-${{ matrix.arch }}.tar.gz aria2c
          rm aria2c

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria2-linux-${{ matrix.arch }}
          path: ./artifacts/aria2-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    needs: [extract-binaries, resolve-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: aria2-linux-amd64
          path: ./aria2-linux-amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: aria2-linux-arm64
          path: ./aria2-linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.release_tag }}
          name: Aria2 ${{ needs.resolve-tag.outputs.release_tag }}
          draft: false
          prerelease: false
          overwrite: true
          files: |
            ./aria2-linux-amd64/aria2-linux-amd64.tar.gz
            ./aria2-linux-arm64/aria2-linux-arm64.tar.gz
